// ============================================================
// LINKS — major flows (not exhaustive). Direction: source supplies target.
// ============================================================
const LINKS = [
  // Materials -> Foundries / IDMs / Memory

  ["airliquide","tsmc"],["airliquide","stmicro"],
  ["jsr","tsmc"],["jsr","samsung_foundry"],["jsr","intel"],
  ["tokyoohka","tsmc"],["tokyoohka","samsung_foundry"],

  // Equipment -> Foundries / IDMs / Memory
  ["asml","tsmc"],["asml","samsung_foundry"],["asml","intel"],["asml","skhynix"],["asml","micron"],["asml","intel_foundry"],
  ["amat","tsmc"],["amat","samsung_foundry"],["amat","intel"],["amat","skhynix"],["amat","micron"],["amat","smic"],
  ["lam","tsmc"],["lam","samsung_foundry"],["lam","intel"],["lam","skhynix"],["lam","micron"],
  ["kla","tsmc"],["kla","samsung_foundry"],["kla","intel"],
  ["tel","tsmc"],["tel","samsung_foundry"],["tel","skhynix"],["tel","intel"],
  ["screen","tsmc"],["screen","samsung_foundry"],
  ["asmi","tsmc"],["asmi","samsung_foundry"],["asmi","intel"],
  ["amec","smic"],["amec","huahong"],["amec","ymtc"],
  ["naura","smic"],["naura","huahong"],["naura","cxmt"],
  ["canon_litho","umc"],["canon_litho","globalfoundries"],
  ["nikon_litho","umc"],

  // EDA / IP -> Designers
  ["synopsys","nvidia"],["synopsys","amd"],["synopsys","qualcomm"],["synopsys","apple_si"],["synopsys","mediatek"],["synopsys","broadcom"],["synopsys","intel"],["synopsys","samsung"],
  ["cadence","nvidia"],["cadence","amd"],["cadence","apple_si"],["cadence","broadcom"],["cadence","marvell"],["cadence","intel"],
  ["siemens_eda","nxp"],["siemens_eda","infineon"],["siemens_eda","stmicro"],["siemens_eda","ti"],
  ["arm","apple_si"],["arm","qualcomm"],["arm","mediatek"],["arm","nvidia"],["arm","amd"],["arm","amazon"],["arm","msft"],["arm","samsung"],["arm","huawei"],
  ["sifive","intel"],["sifive","google"],

  // Fabless / IDM -> Foundries (manufacturing)
  ["nvidia","tsmc"],["amd","tsmc"],["qualcomm","tsmc"],["qualcomm","samsung_foundry"],
  ["apple_si","tsmc"],["mediatek","tsmc"],["broadcom","tsmc"],["marvell","tsmc"],
  ["realtek","tsmc"],["realtek","umc"],["novatek","umc"],["novatek","tsmc"],["himax","umc"],

  // IDMs that also use foundries for some products
  ["intel","tsmc"],["stmicro","tsmc"],["nxp","tsmc"],["nxp","samsung_foundry"],["infineon","tsmc"],
  ["renesas","tsmc"],["renesas","umc"],["analog","tsmc"],["analog","globalfoundries"],
  ["microchip","tsmc"],["onsemi","globalfoundries"],["sony_si","tsmc"],
  ["skyworks","tower"],["qorvo","globalfoundries"],
  ["huawei","smic"],["huawei","tsmc"],

  // Foundries / IDMs -> OSAT
  ["tsmc","ase"],["tsmc","amkor"],["samsung_foundry","ase"],["samsung_foundry","amkor"],
  ["globalfoundries","ase"],["globalfoundries","amkor"],
  ["smic","jcet"],["smic","tongfu"],
  ["umc","ase"],["umc","powertech"],
  ["intel","amkor"],["intel","ase"],
  ["skhynix","powertech"],["micron","powertech"],["micron","amkor"],
  ["samsung_mem","powertech"],

  // OSAT -> end products (downstream channels)
  ["ase","apple"],["ase","nvidia"],["ase","qualcomm"],
  ["amkor","apple"],["amkor","amd"],["amkor","nvidia"],

  // Designers / IDMs -> Distribution -> SMB customers (illustrative)
  ["ti","avnet"],["ti","arrow"],["ti","digikey"],["ti","mouser"],
  ["analog","avnet"],["analog","arrow"],["analog","digikey"],
  ["stmicro","avnet"],["stmicro","arrow"],["stmicro","wpg"],
  ["nxp","arrow"],["nxp","wpg"],
  ["microchip","digikey"],["microchip","mouser"],
  ["infineon","arrow"],["infineon","wpg"],
  ["onsemi","avnet"],["renesas","wpg"],

  // End-market direct: chips -> OEMs / hyperscalers / consumer brands
  ["nvidia","msft"],["nvidia","meta"],["nvidia","google"],["nvidia","amazon"],["nvidia","tesla"],["nvidia","supermicro"],["nvidia","dell"],["nvidia","hpe"],["nvidia","xiaomi"],
  ["amd","msft"],["amd","meta"],["amd","amazon"],["amd","dell"],["amd","supermicro"],
  ["intel","dell"],["intel","hpe"],["intel","msft"],["intel","amazon"],["intel","apple"],
  ["apple_si","apple"],
  ["qualcomm","apple"],["qualcomm","xiaomi"],["qualcomm","honhai"],
  ["mediatek","xiaomi"],["mediatek","honhai"],
  ["samsung","honhai"],["sony_si","apple"],["sony_si","sony_end"],
  ["broadcom","google"],["broadcom","apple"],["broadcom","meta"],
  ["marvell","amazon"],["marvell","msft"],
  ["skyworks","apple"],["cirrus","apple"],
  ["skhynix","nvidia"],["samsung_mem","nvidia"],["micron","nvidia"],
  ["skhynix","amd"],["micron","amd"],
  ["nxp","tsla_auto"],["infineon","tsla_auto"],["stmicro","tsla_auto"],["onsemi","tsla_auto"],["renesas","tsla_auto"],["ti","tsla_auto"],["wolfspeed","tesla"],["stmicro","tesla"],
  ["huawei","huawei"], // self for highlight; will filter
  ["xiaomi","xiaomi"],

  // Distribution -> long tail of OEMs (visualized as collapsing to honhai/dell as proxy)
  ["avnet","honhai"],["arrow","dell"],["wpg","honhai"],["digikey","supermicro"],["mouser","supermicro"]
];

// drop self-loops (hack from above)
const linksClean = LINKS.filter(([a,b]) => a !== b);

// ============================================================
// LAYOUT
// ============================================================

const W = 5400;   // very large canvas — pan/zoom
const H = 3000;
const PAD_TOP = 100;
const PAD_BOTTOM = 80;

const layerCount = LAYERS.length;
const colHeight = (H - PAD_TOP - PAD_BOTTOM);
const layerHeight = colHeight / layerCount;

// Group nodes by layer
const byLayer = d3.group(NODES, d => d.layer);

// Sort each layer by mcap desc so the biggest land near the center
LAYERS.forEach(layer => {
  const arr = byLayer.get(layer.id) || [];
  arr.sort((a,b) => b.mcap - a.mcap);
});

// Market-cap radius scale
const maxMcap = d3.max(NODES, d => d.mcap);
const rScale = d3.scaleSqrt().domain([0.5, maxMcap]).range([5, 70]);

// Position nodes within each layer band
LAYERS.forEach((layer, li) => {
  const arr = byLayer.get(layer.id) || [];
  const yCenter = PAD_TOP + li * layerHeight + layerHeight / 2;
  const totalWidth = W - 220; // leave room for layer label on left
  const xStart = 220;

  // arrange in a grid; bigger circles get more space
  const radii = arr.map(d => rScale(d.mcap));
  const totalDiameter = d3.sum(radii) * 2 + (arr.length - 1) * 18;
  let scale = 1;
  if (totalDiameter > totalWidth) scale = totalWidth / totalDiameter;
  // Compute cumulative positions
  let x = xStart;
  arr.forEach((n, i) => {
    const r = radii[i] * scale;
    n.r = Math.max(r, 5);
    x += n.r;
    // small vertical jitter so similar-mcap layers don't look like a perfect line
    const jitter = ((i % 3) - 1) * (layerHeight * 0.16);
    n.x = x;
    n.y = yCenter + jitter;
    x += n.r + 18 * scale;
  });
});

// Build a quick lookup
const nodeById = new Map(NODES.map(n => [n.id, n]));

// Validate links and build adjacency
const validLinks = linksClean.filter(([s,t]) => nodeById.has(s) && nodeById.has(t));
const adjacency = new Map(); // id -> Set of connected ids
NODES.forEach(n => adjacency.set(n.id, new Set()));
validLinks.forEach(([s,t]) => {
  adjacency.get(s).add(t);
  adjacency.get(t).add(s);
});

// ============================================================
// RENDER
// ============================================================

const svg = d3.select("#viz")
  .attr("width", window.innerWidth)
  .attr("height", window.innerHeight)
  .attr("viewBox", [0, 0, window.innerWidth, window.innerHeight]);

const g = svg.append("g");

// Background layer bands
LAYERS.forEach((layer, li) => {
  const y = PAD_TOP + li * layerHeight;
  g.append("rect")
    .attr("class","layer-band")
    .attr("x", 0).attr("y", y)
    .attr("width", W).attr("height", layerHeight - 8);
  g.append("text")
    .attr("class","layer-label")
    .attr("x", 24).attr("y", y + 36)
    .text(layer.name)
    .attr("fill", layer.color);
  g.append("text")
    .attr("class","layer-sublabel")
    .attr("x", 24).attr("y", y + 56)
    .text(layer.sub);
});

// Links — curved Bezier paths between layers
const linkG = g.append("g").attr("class","links");
const linkSel = linkG.selectAll("path")
  .data(validLinks)
  .enter().append("path")
  .attr("class","link")
  .attr("d", ([s,t]) => {
    const a = nodeById.get(s), b = nodeById.get(t);
    const dy = b.y - a.y;
    const c1x = a.x, c1y = a.y + dy * 0.55;
    const c2x = b.x, c2y = b.y - dy * 0.55;
    return `M${a.x},${a.y} C${c1x},${c1y} ${c2x},${c2y} ${b.x},${b.y}`;
  })
  .attr("stroke", ([s,t]) => {
    // color link by source layer
    const src = nodeById.get(s);
    const layer = LAYERS.find(l => l.id === src.layer);
    return layer ? layer.color : "#2e3a5e";
  })
  .attr("stroke-opacity", 0.18);

// Nodes
const nodeG = g.append("g").attr("class","nodes");
const nodeSel = nodeG.selectAll("g.node")
  .data(NODES)
  .enter().append("g")
  .attr("class","node")
  .attr("transform", d => `translate(${d.x},${d.y})`)
  .on("mouseover", (event, d) => showTip(event, d))
  .on("mousemove", (event) => moveTip(event))
  .on("mouseout", hideTip)
  .on("click", (event, d) => {
    event.stopPropagation();
    highlightConnections(d);
  });

nodeSel.append("circle")
  .attr("r", d => d.r)
  .attr("fill", d => {
    const layer = LAYERS.find(l => l.id === d.layer);
    return layer ? layer.color : "#888";
  })
  .attr("fill-opacity", 0.78);

nodeSel.append("text")
  .attr("dy", d => d.r + 14)
  .text(d => d.name)
  .style("font-size", d => Math.max(10, Math.min(16, 9 + d.r/10)) + "px");

// Add mcap label inside large circles
nodeSel.filter(d => d.r > 22).append("text")
  .attr("dy", "0.35em")
  .text(d => "$" + (d.mcap >= 1000 ? (d.mcap/1000).toFixed(1)+"T" : d.mcap+"B"))
  .style("font-size", d => Math.max(10, d.r/3) + "px")
  .style("font-weight","700")
  .style("fill","#fff")
  .style("stroke","none");

// ============================================================
// ZOOM / PAN
// ============================================================

const zoom = d3.zoom()
  .scaleExtent([0.05, 6])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  });

svg.call(zoom);
svg.on("click", () => clearHighlight());

// Initial fit-to-screen
function fitToScreen() {
  const w = window.innerWidth, h = window.innerHeight;
  const scale = Math.min(w / W, h / H) * 0.95;
  const tx = (w - W * scale) / 2;
  const ty = (h - H * scale) / 2;
  svg.transition().duration(700).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}
fitToScreen();

document.getElementById("reset").onclick = () => fitToScreen();
document.getElementById("fit").onclick   = () => fitToScreen();

// ============================================================
// SEARCH + COUNTRY FILTER
// ============================================================

// Build country filter
const countries = Array.from(new Set(NODES.map(n => {
  // simplify country labels for filter
  return n.country.split("/")[0].trim();
}))).sort();
const cf = document.getElementById("country-filter");
countries.forEach(c => {
  const o = document.createElement("option"); o.value = c; o.textContent = c;
  cf.appendChild(o);
});

cf.onchange = () => {
  const v = cf.value;
  if (!v) { clearHighlight(); return; }
  const matchIds = new Set(NODES.filter(n => n.country.startsWith(v)).map(n => n.id));
  nodeSel.classed("dim", n => !matchIds.has(n.id));
  linkSel.classed("dim", ([s,t]) => !matchIds.has(s) && !matchIds.has(t));
};

const searchInput = document.getElementById("search");
const searchResults = document.getElementById("search-results");
searchInput.oninput = () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = "";
  if (!q) return;
  const matches = NODES.filter(n =>
    n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)
  ).slice(0, 12);
  matches.forEach(n => {
    const div = document.createElement("div");
    div.className = "sr";
    const layer = LAYERS.find(l => l.id === n.layer);
    div.innerHTML = `<span>${n.name}</span><span class="c">${layer ? layer.name.split(" ")[0] : ""}</span>`;
    div.onclick = () => zoomToNode(n);
    searchResults.appendChild(div);
  });
};

function zoomToNode(n) {
  const w = window.innerWidth, h = window.innerHeight;
  const scale = 1.2;
  const tx = w/2 - n.x * scale;
  const ty = h/2 - n.y * scale;
  svg.transition().duration(700).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
  highlightConnections(n);
  searchResults.innerHTML = "";
  searchInput.value = "";
}

// ============================================================
// INTERACTION: highlight connections
// ============================================================

function highlightConnections(d) {
  const connected = adjacency.get(d.id);
  nodeSel.classed("dim", n => n.id !== d.id && !connected.has(n.id));
  linkSel.classed("highlight", ([s,t]) => s === d.id || t === d.id);
  linkSel.classed("dim", ([s,t]) => s !== d.id && t !== d.id);
}
function clearHighlight() {
  nodeSel.classed("dim", false);
  linkSel.classed("highlight", false).classed("dim", false);
}

// ============================================================
// TOOLTIP
// ============================================================

const tip = document.getElementById("tooltip");
function showTip(event, d) {
  const layer = LAYERS.find(l => l.id === d.layer);
  const mcap = d.mcap >= 1000
    ? "$" + (d.mcap/1000).toFixed(2) + "T"
    : "$" + d.mcap + "B";
  tip.innerHTML = `
    <div class="name">${d.name}</div>
    <div class="cat">${layer ? layer.name : ""}</div>
    <div class="country">📍 ${d.country}</div>
    <div class="mc">Market cap: ${mcap}</div>
    <div class="desc">${d.desc}</div>
  `;
  tip.style.opacity = 1;
  moveTip(event);
}
function moveTip(event) {
  const x = event.clientX + 16;
  const y = event.clientY + 16;
  tip.style.left = Math.min(x, window.innerWidth - 300) + "px";
  tip.style.top  = Math.min(y, window.innerHeight - 180) + "px";
}
function hideTip() { tip.style.opacity = 0; }

// ============================================================
// LEGEND
// ============================================================
const legendItems = d3.select("#legend-items");
LAYERS.forEach(l => {
  const li = legendItems.append("div").attr("class","li");
  li.append("div").attr("class","sw").style("background", l.color);
  li.append("span").text(l.name);
});

// ============================================================
// Resize
// ============================================================
window.addEventListener("resize", () => {
  svg.attr("width", window.innerWidth).attr("height", window.innerHeight)
     .attr("viewBox", [0, 0, window.innerWidth, window.innerHeight]);
});
</script>
